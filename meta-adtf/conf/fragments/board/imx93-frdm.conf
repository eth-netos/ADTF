BB_CONF_FRAGMENT_SUMMARY = "FRDM i.MX93 board build configuration"
BB_CONF_FRAGMENT_DESCRIPTION = "Machine, distro and license policy for \
building images for the FRDM i.MX93 board. See \
doc/building/building_imx93_images.md in the ADTF repository."

MACHINE = "imx93-11x11-lpddr4x-frdm"
DISTRO = "poky"

# nxpiw612-sdio and nxpwifi-all-sdio pull in proprietary Wi-Fi firmware.
# The OP-TEE recipes use build metadata copied from meta-imx, whose license
# is unclear.
MACHINE_FEATURES:remove = "nxpiw612-sdio nxpwifi-all-sdio optee"

# The only proprietary software allowed is the unmodified EdgeLock Secure
# Enclave (ELE) firmware and the DDR training firmware. Exceptions name
# packages, not recipes; a recipe is only skipped if all of its packages
# are incompatible.
INCOMPATIBLE_LICENSE = "LicenseRef-Proprietary"
INCOMPATIBLE_LICENSE_EXCEPTIONS = " \
    firmware-ele-imx:LicenseRef-Proprietary \
    imx-boot-firmware-files:LicenseRef-Proprietary \
"

INHERIT += "rm_work"
